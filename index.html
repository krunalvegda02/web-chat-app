<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    
    <!-- Strip sensitive params from URL immediately, before React loads.
         Params are saved to sessionStorage so the app can still read them. -->
    <script>
      (function() {
        var SENSITIVE = ['apiKey','key','api_key','name','email','phone','autoLogin','auto','platform','userId','sessionToken','st'];
        var url = new URL(window.location.href);
        var captured = {};
        var changed = false;
        SENSITIVE.forEach(function(p) {
          if (url.searchParams.has(p)) {
            captured[p] = url.searchParams.get(p);
            url.searchParams.delete(p);
            changed = true;
          }
        });
        if (changed) {
          sessionStorage.setItem('__platformParams', JSON.stringify(captured));
          var clean = url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : '');
          window.history.replaceState(null, '', clean);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
