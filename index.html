<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>frontend</title>
    
    <!-- Ultimate fallback for root path redirect -->
    <script>
      // Check if we're on root path and redirect to login if needed
      (function() {
        if (window.location.pathname === '/' && !window.location.search) {
          console.log('🔄 [HTML] Root path detected, setting up redirect fallback');
          
          // Set a timeout to redirect if React doesn't handle it
          setTimeout(function() {
            if (window.location.pathname === '/' && !window.location.search) {
              console.log('🔄 [HTML] React redirect failed, using fallback');
              window.location.replace('/login');
            }
          }, 2000); // Wait 2 seconds for React to load
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
